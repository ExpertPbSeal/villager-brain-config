name: Build and attach the mod jar

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read the mod version
        id: version
        run: |
          version=$(sed -n 's/^mod\.version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::mod.version is missing from gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mod.version = $version"

      - name: Warn when the tag does not match the mod version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} does not match mod.version ${{ steps.version.outputs.version }}, the jar name keeps the gradle version"
          fi

      - name: Prepare Gradle for the runner
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4G/' gradle.properties
          grep -E '^(org\.gradle|mod\.version)' gradle.properties

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: List the produced jars
        run: |
          ls -l build/libs
          test -n "$(find build/libs -name '*-neoforge-*.jar' -print -quit)" || {
            echo "::error::no mod jar was produced in build/libs"
            exit 1
          }

      - name: Attach the jar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*-neoforge-*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the jar as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: villager_brain_config-${{ steps.version.outputs.version }}
          path: build/libs/*-neoforge-*.jar
          if-no-files-found: error
