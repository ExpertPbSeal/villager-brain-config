modLoader = "javafml"
loaderVersion="[1,)"
license="${license}"
showAsResourcePack=false

issueTrackerURL = "https://github.com/${github}/${name}/issues"

[[mods]]
modId="${id}"
version="${modversion}"
displayName="${display_name}"
authors="${author}"
description="${description}"
logoFile="assets/${id}/textures/mod_logo.png"
displayURL = "https://github.com/${github}/${name}/"

[[mixins]]
config = "mixins.villager_brain_config.json"

[[dependencies."${id}"]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"

[[dependencies."${id}"]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"
